- id: unicode-smuggling-guard
  name: unicode smuggling guard
  description: Detect invisible Unicode used to smuggle instructions into code, docs and AI agent files.
  entry: unicode-smuggling-guard
  language: python
  types: [text]
- id: unicode-smuggling-guard-agent-files
  name: unicode smuggling guard (agent files)
  description: Scan only agent instruction, skill and MCP config files for hidden Unicode and forged chat-template turns.
  entry: unicode-smuggling-guard --preset agent-files
  language: python
  types: [text]
